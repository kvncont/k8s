apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        # Excluye el clúster implícito "in-cluster" para no duplicar la Application
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "{{.name}}-core"
    spec:
      project: core
      source:
        repoURL: https://github.com/kvncont/k8s
        targetRevision: refactor/structure
        path: dev/core
        directory:
          recurse: true
      destination:
        server: "{{.server}}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
