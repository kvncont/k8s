apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: https://github.com/kvncont/k8s
              revision: refactor/structure
              directories:
                - path: dev/projects/*
  template:
    metadata:
      name: "{{name}}-{{path.basenameNormalized}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/kvncont/k8s
        targetRevision: refactor/structure
        path: "{{path}}"
      destination:
        server: "{{server}}"
        namespace: argocd
      syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
