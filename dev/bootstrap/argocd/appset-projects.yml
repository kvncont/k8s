apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: https://github.com/kvncont/k8s
              revision: refactor/structure
              files:
                - path: "dev/projects/projects-*.yml"
  template:
    metadata:
      name: "{{name}}-{{path.filenameNormalized}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/kvncont/k8s
        targetRevision: refactor/structure
        path: dev/projects
        # directory:
        #   include: "projects-{{path.basename}}"
      destination:
        server: '{{server}}'
        namespace: argocd
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
