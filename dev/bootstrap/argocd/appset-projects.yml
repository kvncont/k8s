apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  generators:
    - clusters:
        # Excluye el clúster implícito "in-cluster" para no duplicar la Application
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "{{name}}-projects"
    spec:
      project: default
      source:
        repoURL: https://github.com/kvncont/k8s
        targetRevision: refactor/structure
        path: dev/projects
      destination:
        server: "{{server}}"
        namespace: argocd
      syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
