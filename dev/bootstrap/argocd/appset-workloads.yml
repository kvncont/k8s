apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - clusters:
        # Excluye el clúster implícito "in-cluster" para no duplicar la Application
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
    # - matrix:
    #     generators:
    #       - clusters:
    #           # Excluye el clúster implícito "in-cluster" para no duplicar la Application
    #           selector:
    #             matchLabels:
    #               argocd.argoproj.io/secret-type: cluster
    #       - git:
    #           repoURL: https://github.com/kvncont/k8s
    #           revision: refactor/structure
    #           files:
    #             - path: "dev/workloads/*.yml"
  template:
    metadata:
      name: "{{name}}-{{path.basenameNormalized}}"
    spec:
      project: backends
      sources:
        - repoURL: https://github.com/kvncont/helm-charts
          targetRevision: main
          path: .
          helm:
            valueFiles:
              - $values/dev/workloads
        - repoURL: https://github.com/kvncont/k8s
          targetRevision: refactor/structure
          ref: values
      destination:
        server: "{{server}}"
        namespace: backends
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true