apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              # Excluye el clúster implícito "in-cluster" para no duplicar la Application
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: https://github.com/kvncont/k8s
              revision: refactor/structure
              files:
                - path: "dev/workloads/*.yml"
  template:
    metadata:
      name: "{{.name}}-{{ trimSuffix \".yml\" .path.filename }}"
    spec:
      project: backends
      sources:
        - repoURL: https://github.com/kvncont/helm-charts
          targetRevision: main
          path: .
          helm:
            valueFiles:
              - $values/dev/workloads/{{.path.filename}}
        - repoURL: https://github.com/kvncont/k8s
          targetRevision: refactor/structure
          ref: values
      destination:
        server: "{{.server}}"
        namespace: backends
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true