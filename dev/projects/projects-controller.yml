apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: controllers
  namespace: argocd
spec:
  description: Controllers project
  sourceRepos:
    - "*"
  sourceNamespaces:
    - argocd
  destinations:
    - server: '*'
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"